<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サーブコーチ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
<meta name="theme-color" content="#F5F6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F5F6F1;--ink:#14211A;--sub:#5B675F;--line:#DDE1D8;--court:#1E5A3C;--ball:#D9E43A;--warn:#B4501A;--blue:#2F6FD6;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Apple SD Gothic Neo','Noto Sans JP','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:84px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header b{font-weight:900;font-size:17px;letter-spacing:-.02em}
header .ball{width:14px;height:14px;border-radius:50%;background:var(--ball);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
header small{margin-left:auto;margin-right:6px;color:var(--sub);font-size:12px}
main{padding:16px 18px;max-width:560px;margin:0 auto}
h1{font-size:22px;font-weight:900;letter-spacing:-.03em;margin:4px 0 12px}
h2{font-size:16px;font-weight:700;margin:22px 0 10px}
p.sub{color:var(--sub);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.hero{background:var(--court);color:#fff;border:none}
.hero .k{font-size:12px;opacity:.75}
.hero .t{font-size:20px;font-weight:900;margin:4px 0 6px;letter-spacing:-.02em}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:16px;background:var(--ink);color:#fff;text-align:center;cursor:pointer;margin-top:10px}
.btn.ball{background:var(--ball);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--court);transition:width .2s}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .n{font-weight:700}
.item .v{margin-left:auto;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.tag.good{background:#E3F1E7;color:var(--court)}.tag.mid{background:#F1F0DA;color:#6B6A1E}.tag.warn{background:#F8E5DA;color:var(--warn)}.tag.na{background:#ECEDEA;color:var(--sub)}
.tag.up{background:#E3F1E7;color:var(--court)}.tag.same{background:#ECEDEA;color:var(--sub)}.tag.down{background:#F8E5DA;color:var(--warn)}
.msg{font-size:13.5px;color:var(--sub);margin-top:2px}
canvas,img.frame{width:100%;border-radius:12px;display:block;background:#111}
.serves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.serves .s{position:relative;border-radius:10px;overflow:hidden;border:2.5px solid transparent;cursor:pointer}
.serves .s.on{border-color:var(--ball)}
.serves .s.off{opacity:.35}
.serves .s span{position:absolute;left:6px;top:4px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.day{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:none}
.day .d{width:46px;flex:none;text-align:center}
.day .d b{display:block;font-size:17px}.day .d small{color:var(--sub);font-size:12px}
.day.court .d b{color:var(--court)}
.day label{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:2px 0}
.day input{margin-top:4px;accent-color:var(--court)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:none;background:none;font:inherit;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--ink);font-weight:700}
nav svg{width:22px;height:22px}
.guide{position:relative;aspect-ratio:9/16;max-height:320px;margin:0 auto;border-radius:14px;background:linear-gradient(#cfd8cc,#9fb59b);overflow:hidden}
.guide svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:12.5px;color:var(--sub);background:#ECEDEA;border-radius:10px;padding:10px 12px;margin-top:12px}
.warnbox{background:#F8E5DA;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.adj{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.adj button{width:56px}
.hide{display:none!important}
.range{font-size:12px;color:var(--blue);margin-top:3px}
ol.prio{padding-left:20px}ol.prio li{margin:6px 0 10px}
.tag.now{background:var(--court);color:#fff}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.flow canvas{background:#EEF1EA;aspect-ratio:3/4;height:auto}
.flow img.frame{aspect-ratio:9/16;object-fit:cover}
.msg.c{text-align:center}
.phase{text-align:center;font-weight:700;margin:8px 0}
table.ang{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.ang th,table.ang td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
table.ang th{font-size:11.5px;color:var(--sub);font-weight:500}
table.ang td:first-child{text-align:left}
table.ang tr.on{background:#EAF2FC}
.you{color:var(--court);font-weight:700}
</style>
</head>
<body>
<header><span class="ball"></span><b id="brand">サーブコーチ</b><small>beta v0</small><button id="langbtn" class="chip" style="padding:4px 10px;font-size:12px">한국어</button></header>
<main id="app"></main>
<nav id="nav">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg><span></span></button>
  <button data-go="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/></svg><span></span></button>
  <button data-go="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span></span></button>
  <button data-go="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span></span></button>
</nav>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai'))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
